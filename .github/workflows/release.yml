# Builds Trifold RTS for Windows and Linux and publishes the installers to a
# GitHub Release, where the in-app auto-updater picks them up.
#
# To cut a release:
#   1. Bump "version" in package.json (e.g. 1.0.1).
#   2. git tag v1.0.1 && git push origin v1.0.1
# GitHub then builds on a real Windows runner and a real Linux runner in
# parallel and uploads the artifacts to the matching Release.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # allow electron-builder to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false   # one OS failing shouldn't cancel the other build
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
